<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance — révision et repos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#171514}
:root{--up:7px 7px 16px rgba(0,0,0,.6),-6px -6px 14px rgba(255,236,220,.05);--up-sm:4px 4px 9px rgba(0,0,0,.55),-3px -3px 8px rgba(255,236,220,.045);--in:inset 5px 5px 11px rgba(0,0,0,.6),inset -4px -4px 10px rgba(255,236,220,.045);--in-sm:inset 3px 3px 6px rgba(0,0,0,.55),inset -2px -2px 5px rgba(255,236,220,.04);--fire:linear-gradient(135deg,#FFD23F 0%,#FF8A1F 50%,#EE4A2B 100%);--glow:0 12px 28px -8px rgba(255,105,35,.6)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;border:0;outline:none;background:transparent;margin:0}
.fire-text{background:linear-gradient(135deg,#FFD23F 0%,#FF8A1F 55%,#EE4A2B 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.d{font-family:'Chakra Petch','Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes halo{0%,100%{box-shadow:inset 5px 5px 11px rgba(0,0,0,.6),inset -4px -4px 10px rgba(255,236,220,.045),0 0 20px 0 rgba(255,140,40,.25)}50%{box-shadow:inset 5px 5px 11px rgba(0,0,0,.6),inset -4px -4px 10px rgba(255,236,220,.045),0 0 56px 8px rgba(255,140,40,.6)}}
.live{animation:pulse-dot 1.6s ease-in-out infinite}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
.ring{transition:stroke-dasharray 1s linear}
.halo{animation:halo 1.4s ease-in-out infinite}
.press:active{box-shadow:inset 3px 3px 6px rgba(0,0,0,.55),inset -2px -2px 5px rgba(255,236,220,.04)!important;transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #23201E; color: #F4EEE8; font-family: 'Barlow', 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 44px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div class="d" style="flex: 1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px">
        <span class="live" style="width: 8px; height: 8px; border-radius: 50%; background: #FF8A1F; box-shadow: 0 0 10px #FF8A1F"></span>{{total}}
      </div>
      <button aria-label="Couper le son" style="width: 48px; height: 48px; border-radius: 50%; box-shadow: var(--up-sm); display: grid; place-items: center; color: #FFB23F"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg></button>
      <button aria-label="Abandonner l'entrainement" style="width: 48px; height: 48px; border-radius: 50%; box-shadow: var(--up-sm); display: grid; place-items: center; color: #ABA39B"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div role="progressbar" aria-valuenow="29" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 14px; border-radius: 999px; box-shadow: var(--in-sm); padding: 3px; box-sizing: border-box">
        <div style="width: 29%; height: 100%; border-radius: 999px; background: var(--fire); box-shadow: 0 0 12px rgba(255,120,40,.6)"></div>
      </div>
      <span class="d" style="min-width: 44px; text-align: right; font-weight: 700; font-size: 15px; color: #ABA39B">29%</span>
    </div>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; padding: 28px 24px 44px; gap: 26px">
    <section class="rise" style="border-radius: 26px; background: linear-gradient(145deg, #282422, #1F1C1A); box-shadow: var(--up); padding: 18px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 16px">
      <span style="font-size: 15px; color: #ABA39B">Résultat — <strong style="color: #F4EEE8; font-weight: 600">Pompes, série 2</strong></span>
      <div style="display: flex; align-items: center; gap: 14px">
        <button class="press" aria-label="Retirer 1" onClick="{{dec}}" style="width: 60px; height: 60px; border-radius: 50%; box-shadow: var(--up-sm); display: grid; place-items: center; color: #F4EEE8; transition: transform .1s"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
        <input aria-label="Valeur réalisée" inputmode="numeric" class="d" value="{{v}}" onChange="{{onV}}" style="width: 104px; height: 68px; border-radius: 20px; box-shadow: var(--in); text-align: center; font-weight: 800; font-size: 40px">
        <button class="press" aria-label="Ajouter 1" onClick="{{inc}}" style="width: 60px; height: 60px; border-radius: 50%; box-shadow: var(--up-sm); display: grid; place-items: center; color: #F4EEE8; transition: transform .1s"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
      </div>
      <span style="font-size: 15px; font-weight: 600; color: #ABA39B">reps</span>
    </section>

    <div class="rise" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; animation-delay: .12s">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #ABA39B">Repos</span>
      <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
        <div style="width: 224px; height: 224px; border-radius: 50%; box-shadow: var(--in); position: relative; display: grid; place-items: center">
          <svg aria-hidden="true" width="224" height="224" viewBox="0 0 224 224" style="position: absolute; inset: 0; transform: rotate(-90deg)">
            <defs><linearGradient id="restfire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD23F"></stop><stop offset="0.5" stop-color="#FF8A1F"></stop><stop offset="1" stop-color="#EE4A2B"></stop></linearGradient></defs>
            <circle class="ring" cx="112" cy="112" r="96" fill="none" stroke="url(#restfire)" stroke-width="8" stroke-linecap="round" stroke-dasharray="{{dash}}" opacity=".9"></circle>
          </svg>
          <span class="d" style="font-weight: 800; font-size: 60px; line-height: 1">{{time}}</span>
        </div>
      </sc-if>
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <div class="halo" style="width: 224px; height: 224px; border-radius: 50%; display: grid; place-items: center">
          <span class="d fire-text pop" style="font-weight: 800; font-size: 60px; line-height: 1">0:00</span>
        </div>
      </sc-if>
      <p style="margin: 6px 0 0; font-size: 15px; color: #ABA39B; text-align: center">À suivre : <strong style="color: #F4EEE8; font-weight: 600">Pompes — série 3/3 (8 reps)</strong></p>
    </div>

    <sc-if value="{{running}}" hint-placeholder-val="{{ true }}">
      <button class="press" onClick="{{skip}}" style="width: 100%; height: 60px; border-radius: 20px; background: #23201E; box-shadow: var(--up-sm); display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 17px; transition: transform .1s">
        Passer
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"></path><path d="m13 17 5-5-5-5"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <button class="pop" onClick="{{restart}}" style="width: 100%; height: 60px; border-radius: 20px; background: var(--fire); box-shadow: var(--up-sm), var(--glow); color: #1A0F0A; display: flex; align-items: center; justify-content: center; gap: 10px">
        <span class="d" style="font-weight: 800; font-size: 17px; font-stretch: 112%">Continuer</span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
      </button>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  st() {
    return Object.assign({ r: 12, v: 11, t: 245 }, this.state || {});
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.st();
      this.setState({ r: Math.max(0, s.r - 1), t: s.t + 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const s = this.st();
    const fmt = (x) => Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0');
    return {
      time: fmt(s.r),
      total: fmt(s.t),
      dash: (s.r / 60 * 603.2).toFixed(1) + ' 603.2',
      running: s.r > 0,
      done: s.r === 0,
      v: String(s.v),
      dec: () => this.setState({ v: Math.max(0, this.st().v - 1) }),
      inc: () => this.setState({ v: this.st().v + 1 }),
      onV: (e) => {
        const n = parseInt(String(e.target.value).replace(/\D/g, ''), 10);
        this.setState({ v: isNaN(n) ? 0 : n });
      },
      skip: () => this.setState({ r: 0 }),
      restart: () => this.setState({ r: 12 })
    };
  }
}
</script>
</body>
</html>
