<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance — chrono</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#171514}
:root{--up:7px 7px 16px rgba(0,0,0,.6),-6px -6px 14px rgba(255,236,220,.05);--up-sm:4px 4px 9px rgba(0,0,0,.55),-3px -3px 8px rgba(255,236,220,.045);--in:inset 5px 5px 11px rgba(0,0,0,.6),inset -4px -4px 10px rgba(255,236,220,.045);--in-sm:inset 3px 3px 6px rgba(0,0,0,.55),inset -2px -2px 5px rgba(255,236,220,.04);--fire:linear-gradient(135deg,#FFD23F 0%,#FF8A1F 50%,#EE4A2B 100%);--glow:0 12px 28px -8px rgba(255,105,35,.6)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.d{font-family:'Chakra Petch','Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fire-live{background:linear-gradient(110deg,#FFD23F 0%,#FF8A1F 25%,#EE4A2B 50%,#FF8A1F 75%,#FFD23F 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes halo{0%,100%{box-shadow:0 0 30px 2px rgba(255,140,40,.35)}50%{box-shadow:0 0 60px 10px rgba(255,140,40,.7)}}
@keyframes spin{to{transform:rotate(360deg)}}
.live{animation:pulse-dot 1.6s ease-in-out infinite}
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.ring{transition:stroke-dasharray 1s linear}
.halo{animation:halo 1.4s ease-in-out infinite}
.spin{transform-origin:150px 150px;animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 55% at 50% 118%, rgba(255,100,30,.16), rgba(255,100,30,0) 62%), #23201E; color: #F4EEE8; font-family: 'Barlow', 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 44px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div class="d" style="flex: 1; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px">
        <span class="live" style="width: 8px; height: 8px; border-radius: 50%; background: #FF8A1F; box-shadow: 0 0 10px #FF8A1F"></span>{{total}}
      </div>
      <button aria-label="Couper le son" style="width: 48px; height: 48px; border-radius: 50%; box-shadow: var(--up-sm); display: grid; place-items: center; color: #FFB23F"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg></button>
      <button aria-label="Abandonner l'entrainement" style="width: 48px; height: 48px; border-radius: 50%; box-shadow: var(--up-sm); display: grid; place-items: center; color: #ABA39B"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div role="progressbar" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 14px; border-radius: 999px; box-shadow: var(--in-sm); padding: 3px; box-sizing: border-box">
        <div style="width: 71%; height: 100%; border-radius: 999px; background: var(--fire); box-shadow: 0 0 12px rgba(255,120,40,.6)"></div>
      </div>
      <span class="d" style="min-width: 44px; text-align: right; font-weight: 700; font-size: 15px; color: #ABA39B">71%</span>
    </div>
  </div>

  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 32px 24px 48px">
    <div class="rise" style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span class="d" style="height: 34px; padding: 0 16px; border-radius: 999px; box-shadow: var(--in-sm); display: inline-flex; align-items: center; font-weight: 700; font-size: 14px; letter-spacing: 0.06em; color: #ABA39B">Série 1 / 2</span>
      <h1 class="d" style="margin: 0; font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -0.02em">Planche</h1>
    </div>

    <div style="width: 300px; height: 300px; border-radius: 50%; background: linear-gradient(145deg, #292523, #1D1A18); box-shadow: var(--up); position: relative; display: grid; place-items: center">
      <sc-if value="{{reached}}" hint-placeholder-val="{{ false }}">
        <div class="halo" style="position: absolute; inset: 0; border-radius: 50%"></div>
      </sc-if>
      <svg aria-hidden="true" width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0; transform: rotate(-90deg)">
        <defs><linearGradient id="ringfire" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD23F"></stop><stop offset="0.5" stop-color="#FF8A1F"></stop><stop offset="1" stop-color="#EE4A2B"></stop></linearGradient></defs>
        <circle cx="150" cy="150" r="128" fill="none" stroke="#191716" stroke-width="16"></circle>
        <circle class="ring" cx="150" cy="150" r="128" fill="none" stroke="url(#ringfire)" stroke-width="16" stroke-linecap="round" stroke-dasharray="{{dash}}" style="filter: drop-shadow(0 0 8px rgba(255,120,40,.55))"></circle>
        <g class="spin"><circle cx="150" cy="22" r="4" fill="#FFE7A8"></circle></g>
      </svg>
      <div style="position: relative; width: 220px; height: 220px; border-radius: 50%; background: #23201E; box-shadow: var(--in); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
        <span class="d fire-live" style="font-weight: 800; font-size: 72px; line-height: 1">{{time}}</span>
        <span style="font-size: 14px; color: #ABA39B">Objectif : <strong style="color: #F4EEE8; font-weight: 700">45 sec</strong></span>
      </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 22px">
      <div style="position: relative; height: 48px; padding: 0 18px 0 6px; border-radius: 999px; box-shadow: var(--up-sm); display: inline-flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 36px; border-radius: 50%; box-shadow: var(--in-sm); display: grid; place-items: center">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="url(#trophy3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><defs><linearGradient id="trophy3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD23F"></stop><stop offset="0.55" stop-color="#FF8A1F"></stop><stop offset="1" stop-color="#EE4A2B"></stop></linearGradient></defs><path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2"></path><path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2"></path><path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"></path><path d="M4 22h16"></path><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"></path><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"></path></svg>
        </span>
        <span class="sr">Record sur cette série :</span>
        <span style="display: inline-flex; align-items: baseline; gap: 5px"><span class="d" style="font-weight: 800; font-size: 20px">52</span><span style="font-size: 14px; font-weight: 600; color: #ABA39B">sec</span></span>
      </div>
      <button style="width: 100%; height: 66px; border-radius: 22px; background: var(--fire); box-shadow: var(--up-sm), var(--glow); color: #1A0F0A; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg>
        <span class="d" style="font-weight: 800; font-size: 18px; font-stretch: 112%">Terminé</span>
      </button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  st() {
    return Object.assign({ e: 37 }, this.state || {});
  }
  componentDidMount() {
    this.timer = setInterval(() => {
      const e = this.st().e;
      this.setState({ e: e >= 60 ? 30 : e + 1 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const e = this.st().e;
    const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    return {
      time: fmt(e),
      total: fmt(604 + e),
      dash: (Math.min(e / 45, 1) * 804.2).toFixed(1) + ' 804.2',
      reached: e >= 45
    };
  }
}
</script>
</body>
</html>
