@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}100%{opacity:1;transform:scale(1)}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
.bar{transform-origin:left center;animation:fill 1.2s cubic-bezier(.2,.7,.2,1) .1s both}
.stagger>*{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.1s}.stagger>*:nth-child(3){animation-delay:.2s}.stagger>*:nth-child(4){animation-delay:.3s}.stagger>*:nth-child(5){animation-delay:.45s}
.stagger section span[style*="999px"]{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stagger section:nth-of-type(1) span[style*="999px"]{animation-delay:.55s}
.stagger section:nth-of-type(2) span[style*="999px"]{animation-delay:.75s}
.stagger section:nth-of-type(3) span[style*="999px"]{animation-delay:.95s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
